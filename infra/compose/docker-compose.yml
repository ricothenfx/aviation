# Local development topology (monorepo-architecture.md §3).
# Profiles: "infra" = postgres + redis only; "turnaround" = full project stack
# (postgres + redis + web); "evidence" = ephemeral Prometheus + Grafana for
# load runs only (ADR-0007 — never part of the demo stack). Run from the repo
# root:
#   docker compose --profile turnaround up -d
#   docker compose --profile evidence up -d   # load-test evidence only
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    profiles: ["turnaround", "infra"]
    environment:
      POSTGRES_USER: turnaround
      POSTGRES_PASSWORD: turnaround
      POSTGRES_DB: turnaround_iq
    ports:
      # Bind to loopback only — safe on public VPS/dev machines; CI and host dev
      # both use localhost. A public demo binding is an F5 deployment concern.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_turnaround:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnaround -d turnaround_iq"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    profiles: ["turnaround", "infra"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Containerized Next dev server (full-container mode, http://localhost:3001).
  # Host mode `pnpm dev` binds :3000 against the same postgres/redis.
  # AUTH_SECRET below is a dev-only throwaway value for local simulated data.
  web:
    image: node:22-bookworm-slim
    profiles: ["turnaround"]
    working_dir: /repo
    command: >-
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm --filter turnaround-iq seed &&
             pnpm --filter turnaround-iq dev"
    environment:
      DATABASE_URL: postgresql://turnaround:turnaround@postgres:5432/turnaround_iq
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-only-insecure-secret-0123456789abcdef
      AUTH_COOKIE_NAME: tiq_session
      # LLM gateway provider for the copilot (ADR-0003). Host .env can override
      # (mock default; "off" exercises the degrade-to-rules path).
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      # Browser → gateway ws (published on host loopback 4001).
      NEXT_PUBLIC_WS_URL: ws://localhost:4001/api/ws
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ../..:/repo
      - web_node_modules:/repo/node_modules
      - web_app_node_modules:/repo/apps/turnaround-iq/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>{if(!r.ok)throw new Error('unhealthy')}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 180s

  # Scenario engine (architecture.md §2): scenario clock → deterministic events
  # into PostgreSQL event_log, published for the projection worker. The browser
  # never talks to it; control flows through Redis from the web API.
  simulator:
    image: node:22-bookworm-slim
    profiles: ["turnaround"]
    working_dir: /repo
    command: >-
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm --filter @aviation/tiq-simulator dev"
    environment:
      DATABASE_URL: postgresql://turnaround:turnaround@postgres:5432/turnaround_iq
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      SIMULATOR_PORT: "4101"
      TICK_INTERVAL_MS: "250"
    ports:
      - "127.0.0.1:4101:4101"
    volumes:
      - ../..:/repo
      - simulator_node_modules:/repo/node_modules
      - simulator_pkg_node_modules:/repo/services/turnaround-iq/simulator/node_modules
      - simulator_domain_node_modules:/repo/services/turnaround-iq/domain/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4101/healthz').then((r)=>{if(!r.ok)throw new Error('unhealthy')}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 180s

  # Realtime gateway (architecture.md §2–4): projection worker → Redis read
  # models + ws delta broadcast on /api/ws (short-lived token auth, §5).
  realtime-gateway:
    image: node:22-bookworm-slim
    profiles: ["turnaround"]
    working_dir: /repo
    command: >-
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm --filter @aviation/tiq-realtime-gateway dev"
    environment:
      DATABASE_URL: postgresql://turnaround:turnaround@postgres:5432/turnaround_iq
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-only-insecure-secret-0123456789abcdef
      LOG_LEVEL: info
      GATEWAY_PORT: "4001"
      PROJECTION_POLL_MS: "400"
    ports:
      # ws + health on one port; the browser connects directly (different origin
      # from the web app — minted ws tokens are purpose-scoped, architecture §5).
      - "127.0.0.1:4001:4001"
    volumes:
      - ../..:/repo
      - gateway_node_modules:/repo/node_modules
      - gateway_pkg_node_modules:/repo/services/turnaround-iq/realtime-gateway/node_modules
      - gateway_domain_node_modules:/repo/services/turnaround-iq/domain/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/healthz').then((r)=>{if(!r.ok)throw new Error('unhealthy')}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 180s

  # Replan engine (architecture.md §2, F3): risk rules + constraint scheduler as
  # an event-tailing worker. Decisions read PostgreSQL only; REST talks to it via
  # the chan:replan:control channel + result keys.
  replan-engine:
    image: node:22-bookworm-slim
    profiles: ["turnaround"]
    working_dir: /repo
    command: >-
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm --filter @aviation/tiq-replan-engine dev"
    environment:
      DATABASE_URL: postgresql://turnaround:turnaround@postgres:5432/turnaround_iq
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      REPLAN_ENGINE_PORT: "4102"
      REPLAN_POLL_MS: "300"
    ports:
      - "127.0.0.1:4102:4102"
    volumes:
      - ../..:/repo
      - replan_node_modules:/repo/node_modules
      - replan_pkg_node_modules:/repo/services/turnaround-iq/replan-engine/node_modules
      - replan_domain_node_modules:/repo/services/turnaround-iq/domain/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4102/healthz').then((r)=>{if(!r.ok)throw new Error('unhealthy')}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 180s

  # Load-run evidence stack (ADR-0007): k6 remote-writes metrics here during
  # `scripts/loadtest/run-loadtest.mjs --prom`; Grafana renders the committed
  # dashboard. Loopback-only, ephemeral — torn down after evidence collection.
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["evidence"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=1d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["evidence"]
    environment:
      # Local evidence-only credentials; the demo stack never runs Grafana.
      GF_SECURITY_ADMIN_USER: evidence
      GF_SECURITY_ADMIN_PASSWORD: evidence-local-only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata_turnaround:
  web_node_modules:
  web_app_node_modules:
  simulator_node_modules:
  simulator_pkg_node_modules:
  simulator_domain_node_modules:
  gateway_node_modules:
  gateway_pkg_node_modules:
  gateway_domain_node_modules:
  replan_node_modules:
  replan_pkg_node_modules:
  replan_domain_node_modules:
