# CI pipeline (monorepo-architecture.md §4, engineering-standards.md §7).
# docs-only changes skip the heavy jobs via paths-ignore.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"

jobs:
  check:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (prettier + eslint, zero warnings)
        run: pnpm lint

      - name: Typecheck (tsc strict across workspace)
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build (packages + next)
        run: pnpm build

  # Milestone F1 DoD: `pnpm install && docker compose --profile turnaround up -d`
  # works from a clean clone and a seeded coordinator can log in.
  # Milestone F2 DoD: integration tests (golden replay, idempotency, worker
  # latency, RBAC matrix) + the ws board-latency benchmark run against the stack.
  compose-smoke:
    name: compose stack smoke + integration (F1/F2 DoD)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot the turnaround stack (postgres + redis + web + simulator + gateway)
        run: docker compose --profile turnaround up -d --wait --wait-timeout 420

      - name: Health + seeded login smoke
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/healthz > /dev/null; then break; fi
            sleep 5
          done
          curl -sf http://localhost:3001/healthz
          echo "healthz OK"
          curl -sf -X POST http://localhost:3001/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"maya.tan@nx-sim.example","password":"coordinator-nx-01"}' \
            | grep -o '"role":"coordinator"'
          echo "seeded coordinator login OK"

      - name: Integration tests (golden replay · idempotency · worker latency · RBAC matrix)
        env:
          DATABASE_URL: postgresql://turnaround:turnaround@localhost:5433/turnaround_iq
          REDIS_URL: redis://localhost:6379
          TIQ_BASE_URL: http://localhost:3001
        # Scoped to turnaround-iq: this job boots only the "turnaround" compose
        # profile, and the root aggregate now also contains mro-copilot's
        # integration suite (which needs the "mro" stack and is covered by the
        # path-filtered mro.yml workflow).
        run: pnpm --filter turnaround-iq test:integration

      - name: Board latency benchmark (ws end-to-end, p95 < 1 s)
        env:
          TIQ_BASE_URL: http://localhost:3001
          TIQ_WS_URL: ws://localhost:4001/api/ws
        run: node scripts/benchmarks/board-latency.mjs

      # Milestone F3 DoD: loader-breakdown replan 47 → ≤ 9 min, computation < 2 s.
      - name: Replan benchmark (loader breakdown, 47 → ≤ 9 min in < 2 s)
        run: node scripts/benchmarks/replan-delay.mjs

      - name: Teardown
        if: always()
        run: docker compose --profile turnaround down -v --remove-orphans
