# E2E pipeline (milestones.md DoD): Playwright drives the products against
# their compose stacks. turnaround-iq job: seed → inject disruption → alert →
# replan → approve → board reflects the new schedule. mro-copilot job (F3):
# login → ask → citation into the manual browser → reviewer approve →
# verified library.
name: e2e

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"

jobs:
  playwright:
    name: playwright (command board e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot the turnaround stack (postgres + redis + web + simulator + gateway + replan-engine)
        run: docker compose --profile turnaround up -d --wait --wait-timeout 420

      - name: Install Playwright browsers
        run: pnpm --filter turnaround-iq exec playwright install --with-deps chromium

      - name: Run e2e (seed → inject → alert → replan → approve → board)
        env:
          TIQ_E2E_BASE_URL: http://localhost:3001
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/turnaround-iq/test-results/
          retention-days: 7

      - name: Upload visual smoke screenshots (F4 DoD evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-screenshots
          path: apps/turnaround-iq/test-results/visual-smoke/
          retention-days: 30

      - name: Teardown
        if: always()
        run: docker compose --profile turnaround down -v --remove-orphans

  playwright-mro:
    name: playwright (mro copilot e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot the mro stack (postgres + web :3003 + ai-service :4103)
        run: docker compose --profile mro up -d --wait --wait-timeout 900

      - name: Install Playwright browsers
        run: pnpm --filter mro-copilot exec playwright install --with-deps chromium

      - name: Run e2e (login → ask → citation → approve → verified library)
        env:
          MRO_E2E_BASE_URL: http://localhost:3003
        run: pnpm test:e2e:mro

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-mro
          path: apps/mro-copilot/test-results/
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose --profile mro down -v --remove-orphans

  playwright-rebook:
    name: playwright (rebook passenger e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot the rebook stack (postgres + redis + web :3004 + orchestrator :4104)
        run: docker compose --profile rebook up -d --wait --wait-timeout 900

      - name: Install Playwright browsers
        run: pnpm --filter rebook-ai exec playwright install --with-deps chromium

      - name: Run e2e (inject → notification → confirm → saga stubs visible)
        env:
          REBOOK_E2E_BASE_URL: http://localhost:3004
        run: pnpm test:e2e:rebook

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-rebook
          path: apps/rebook-ai/test-results/
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose --profile rebook down -v --remove-orphans
