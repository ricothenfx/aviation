[project]
name = "mro-ai"
version = "0.1.0"
description = "mro-copilot ai-service: embeddings, retrieval, RUL serving (ADR-0012)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["mro_ai", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF",
]
ignore = [
  "B008", # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.isort]
known-first-party = ["mro_ai"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "joblib.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
